name: Nag
options:
  bundleIdPrefix: com.codefriar
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: 0.0.0-dev
    CURRENT_PROJECT_VERSION: "1"
targets:
  Nag:
    type: application
    platform: macOS
    sources:
      - Nag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codefriar.nagapp
        PRODUCT_NAME: Nag
        INFOPLIST_FILE: Nag/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NagTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NagTests
      - path: Nag/NotificationService.swift
      - path: Nag/ComposeViewModel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codefriar.nagapp.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nag:
    build:
      targets:
        Nag: all
        NagTests: [test]
    test:
      targets:
        - NagTests
